# CI: el gate (scripts/gate.sh) corre en GitHub, no solo en la máquina local.
# Un PR dice verde o rojo aquí mismo; nada se salta en silencio (el único paso
# de trabajo es el gate, y si no sale 0 el workflow es rojo).
on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la corrida anterior: no se gastan
# minutos verificando dos veces lo mismo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.9 explícito: el gate exige un intérprete 3.9 (sin él el chequeo
      # de sintaxis no detecta código 3.10+). setup-python deja `python3.9` en el
      # PATH, que es el primer candidato del gate.
      - name: Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # El harness hace git de verdad (worktrees, rebase de la rama de un
      # intento anterior), y un rebase sin identidad sale 128. En una máquina
      # de trabajo la identidad global está puesta y no se nota; en el runner
      # no, y el gate venía rojo desde el 2026-08-26 sin que nadie mirara.
      - name: Identidad de git
        run: |
          git config --global user.email "gate@agent-harness.local"
          git config --global user.name "gate"

      - name: Gate
        run: ./scripts/gate.sh
